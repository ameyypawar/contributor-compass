# The charts are designed and colour-validated against a light surface
# (#fcfcfb), so the theme is pinned rather than following the OS setting.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
